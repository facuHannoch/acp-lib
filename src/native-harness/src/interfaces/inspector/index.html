<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harness context inspector</title>
<style>
  :root { color-scheme: light dark; font: 15px system-ui; }
  body { margin: 0; background: light-dark(#f7f8fa,#15171b); }
  header { padding: 18px 24px; border-bottom: 1px solid #8885; display: flex; gap: 24px; align-items: baseline; }
  h1 { font-size: 19px; margin: 0; } h2 { font-size: 18px; }
  #connection, .muted { color: light-dark(#586174,#aab3c3); }
  .layout { display: grid; grid-template-columns: 230px minmax(0,1fr); min-height: 85vh; }
  nav { padding: 16px; border-right: 1px solid #8885; }
  button { display: block; width: 100%; text-align: left; padding: 12px; margin-bottom: 8px; border: 1px solid #8885; border-radius: 7px; cursor: pointer; overflow-wrap: anywhere; }
  button[aria-current=true] { border-color: #888a; font-weight: 600; background: light-dark(#e5edff,#253352); }
  #channels button.working { border-color: #548deb; box-shadow: 0 0 5px #548deb33; animation: working-glow 2s ease-in-out infinite alternate; }
  #channels button.working::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #548deb; box-shadow: 0 0 6px #548deb; }
  @keyframes working-glow { to { box-shadow: 0 0 9px #548deb55; } }
  @media(prefers-reduced-motion: reduce) { #channels button.working { animation: none; } }
  .tabs { display: flex; gap: 8px; padding: 12px 24px; border-bottom: 1px solid #8885; }
  .tabs button { width: auto; margin: 0; }
  .tabs button[aria-selected=true] { border-color: #688def; background: light-dark(#e5edff,#253352); }
  .layout.single { grid-template-columns: minmax(0,1fr); }
  .layout.single nav { display: none; }
  main { padding: 12px 24px 40px; min-width: 0; }
  article, details.request { border: 1px solid #8885; border-radius: 8px; margin: 12px 0; padding: 14px; background: light-dark(white,#1d2026); }
  article.context-card { border: 2px solid #df8a27; }
  article.result-card { border: 2px solid #548deb; }
  .prompt-highlight { color: light-dark(#934100,#ffc078); background: light-dark(#fff0dc,#593615); border-radius: 3px; }
  .notice-highlight { color: light-dark(#6d28a1,#ddb4ff); background: light-dark(#f2e6ff,#43205e); border-radius: 3px; }
  .turn-divider { display: flex; gap: 16px; align-items: center; margin: 32px 0 16px; }
  .turn-divider::before, .turn-divider::after { content: ''; flex: 1; border-top: 1px solid #8888; }
  .iteration { margin-bottom: 28px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 ui-monospace,monospace; }
  summary { cursor: pointer; } .error { color: light-dark(#ac2525,#ff9999); }
  .context-text { border: 1px solid #8885; border-radius: 8px; padding: 20px; min-height: 60vh; background: light-dark(white,#1d2026); }
  @media(max-width:650px) { .layout { grid-template-columns: 1fr; } nav { border-right: 0; } }
</style>
<header><h1>Harness context inspector</h1><span id="connection">Connecting…</span></header>
<div class="tabs" role="tablist" aria-label="Inspector views">
  <button id="tab-live" role="tab" aria-controls="content" aria-selected="true" data-tab="live">Live context</button>
  <button id="tab-timeline" role="tab" aria-controls="content" aria-selected="false" data-tab="timeline">Timeline</button>
  <button id="tab-channels" role="tab" aria-controls="content" aria-selected="false" data-tab="channels">Channels</button>
</div>
<div class="layout single"><nav id="channels"></nav><main id="content" role="tabpanel" aria-labelledby="tab-live">Connecting to the agent…</main></div>
<script>
  let channels = [], selected = null, tab = "live";
  let liveContext = { systemPrompt: "", tools: [], entries: [] };
  let connectionStatus = 'connecting';
  const nav = document.querySelector('#channels'), main = document.querySelector('#content');
  function node(tag, text, className) {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
  }
  function json(value) { return node('pre', JSON.stringify(value, null, 2)); }
  function messageCard(message, label, key, expanded) {
    const card = node('article');
    card.append(node('strong', label), node('pre', message.content ?? ''));
    if (message.calls?.length) card.append(node('p', 'Tool calls'), json(message.calls));
    if (message.callId) card.append(node('p', 'Call ID: ' + message.callId, 'muted'));
    if (message.providerState) {
      const raw = node('details'); raw.dataset.key = key;
      raw.open = expanded.has(key);
      raw.append(node('summary', 'Provider response'), json(message.providerState)); card.append(raw);
    }
    return card;
  }
  function render() {
    const working = channels.filter(channel => channel.running).length;
    document.querySelector('#connection').textContent = connectionStatus === 'live'
      ? 'Live · working in ' + working + ' ' + (working === 1 ? 'channel' : 'channels') + ' · read only'
      : connectionStatus === 'connecting' ? 'Connecting…' : 'Disconnected · reconnecting…';
    const expanded = new Set([...main.querySelectorAll('details[data-key][open]')].map(e => e.dataset.key));
    document.querySelector('.layout').classList.toggle('single', tab !== 'channels');
    main.setAttribute('aria-labelledby', 'tab-' + tab);
    document.querySelectorAll('[data-tab]').forEach(button => button.setAttribute('aria-selected', String(button.dataset.tab === tab)));
    nav.replaceChildren();
    main.replaceChildren();
    if (tab === 'timeline') return;
    if (tab === 'live') {
      main.append(node('p', 'Shared base context · ' + liveContext.entries.length + ' events', 'muted'));
      // Use the same rendered base as inference construction, without inventing
      // an active channel or prompt. Exact requests remain in Channels.
      const text = (liveContext.base ?? []).map(message => message.content ?? '').join('\n\n');
      const container = node('div', undefined, 'context-text');
      container.append(node('pre', text));
      const tools = node('details');
      tools.dataset.key = 'live:tools';
      tools.open = expanded.has(tools.dataset.key);
      tools.append(node('summary', 'Tools'), json(liveContext.tools));
      container.append(tools);
      main.append(container);
      return;
    }
    if (!selected && channels.length) selected = channels[0].id;
    for (const channel of channels) {
      const status = channel.error ? 'failed' : channel.running ? 'running' : channel.pending ? 'queued' : 'idle';
      const button = node('button', channel.id + ' · ' + status);
      button.classList.toggle('working', channel.running && connectionStatus === 'live');
      button.setAttribute('aria-current', String(channel.id === selected));
      button.onclick = () => { selected = channel.id; render(); };
      nav.append(button);
    }
    const channel = channels.find(c => c.id === selected);
    if (!channel) { main.append(node('p', 'No channels yet.', 'muted')); return; }
    main.append(node('h2', 'Channel ' + channel.id));
    main.append(node('p', 'Participants: ' + channel.participants.join(', ') + ' · Pending turns: ' + channel.pending, 'muted'));
    if (channel.error) main.append(node('p', channel.error, 'error'));
    const turns = new Map();
    // Recorded turn IDs distinguish real prompts from user-role context blocks.
    for (const entry of liveContext.entries.filter(e => e.channelId === channel.id)) {
      if (!turns.has(entry.turnId)) turns.set(entry.turnId, []);
    }
    for (const request of channel.requests) {
      const id = request.turnId ?? 'unknown';
      if (!turns.has(id)) turns.set(id, []);
      turns.get(id).push(request);
    }
    for (const [turnId, requests] of turns) {
      main.append(node('h2', turnId === 'unknown' ? 'New turn' : 'Turn ' + turnId, 'turn-divider'));
      const entries = liveContext.entries.filter(e => e.channelId === channel.id && e.turnId === turnId);
      const prompt = entries.find(e => e.kind !== 'channel_notice' && e.message.role === 'user')?.message.content;
      const notices = entries.filter(e => e.kind === 'channel_notice').map(e =>
        'Internal notice from channel ' + JSON.stringify(e.sourceChannelId) + ' to channel ' + JSON.stringify(e.channelId)
        + ' (another execution of this same agent):\n' + e.message.content);
      if (!requests.length) main.append(node('p', channel.error ? 'Turn stopped before inference.' : 'Waiting for inference…', 'muted'));
      for (const [index, request] of requests.entries()) {
        const iteration = node('section', undefined, 'iteration');
        iteration.append(node('p', 'Iteration ' + (index + 1) + ' · ' + request.at, 'muted'));
        const context = node('article', undefined, 'context-card');
        const text = node('pre');
        // Preserve content as literal text, highlighting the active prompt only.
        for (const message of request.body.messages ?? []) {
          if (message.content != null) {
            const content = node('span', typeof message.content === 'string' ? message.content : JSON.stringify(message.content, null, 2));
            if (message.role === 'user' && message.content === prompt) content.className = 'prompt-highlight';
            if (message.role === 'user' && notices.includes(message.content)) content.className = 'notice-highlight';
            text.append(content, document.createTextNode('\n\n'));
          }
          const { role, content, ...fields } = message;
          if (Object.keys(fields).length) text.append(document.createTextNode(JSON.stringify(fields, null, 2) + '\n\n'));
        }
        context.append(node('strong', 'Context'), text);
        if (request.body.tools?.length) {
          const tools = node('details');
          tools.dataset.key = channel.id + ':tools:' + request.number;
          tools.open = expanded.has(tools.dataset.key);
          tools.append(node('summary', 'Tools'), json(request.body.tools));
          context.append(tools);
        }
        const raw = node('details');
        raw.dataset.key = channel.id + ':request:' + request.number;
        raw.open = expanded.has(raw.dataset.key);
        raw.append(node('summary', 'Inference request'), json(request.body));
        context.append(raw);
        iteration.append(context);
        if (request.response) {
          const result = messageCard(request.response, 'Result', channel.id + ':response:' + request.number, expanded);
          result.classList.add('result-card');
          const callIds = new Set((request.response.calls ?? []).map(call => call.id));
          for (const entry of entries.filter(e => e.message.role === 'tool' && callIds.has(e.message.callId))) {
            result.append(node('p', 'Tool result · ' + entry.message.callId, 'muted'), node('pre', entry.message.content));
          }
          iteration.append(result);
        } else {
          const result = node('article', undefined, 'result-card');
          result.append(node('strong', 'Result'), node('p', channel.error ? 'Inference failed: ' + channel.error : 'Waiting for response…', 'muted'));
          iteration.append(result);
        }
        main.append(iteration);
      }
    }
  }
  document.querySelectorAll('[data-tab]').forEach(button => {
    button.onclick = () => { tab = button.dataset.tab; render(); };
  });
  const events = new EventSource('/events');
  events.onopen = () => { connectionStatus = 'live'; render(); };
  events.onerror = () => { connectionStatus = 'disconnected'; render(); };
  events.onmessage = event => { const state = JSON.parse(event.data); channels = state.channels; liveContext = state.liveContext; render(); };
</script>
</html>
